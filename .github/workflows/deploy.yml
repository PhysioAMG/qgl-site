# Publie le site sur l'hébergement OVH (dossier www) à chaque envoi sur la branche main.
name: Publication sur qgl.fr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer les fichiers par SFTP
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_PASSWORD" ]; then
            echo "Le secret SFTP_PASSWORD n'est pas encore enregistré dans le dépôt."; exit 1
          fi
          lftp -u "qglfrrl,$SFTP_PASSWORD" sftp://ftp.cluster129.hosting.ovh.net:22 <<'LFTP'
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --delete --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .git --exclude-glob .gitignore ./ www/
          bye
          LFTP

      - name: Vérifier que le site répond
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://qgl.fr/)
          echo "qgl.fr répond $code"
          test "$code" = "200"
